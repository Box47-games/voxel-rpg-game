<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Riftholm">
  <meta name="theme-color" content="#171c27">
  <meta name="description" content="Riftholm: a voxel settlement survival RPG. Carve the land, raise a settlement, close the rifts.">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/voxel-rpg-game/manifest.json">

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/voxel-rpg-game/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/voxel-rpg-game/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/voxel-rpg-game/icons/apple-touch-icon.png">

  <!-- UI display font (falls back to system fonts offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <title>Riftholm</title>

  <style>
    /* CSS Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      background: #0f0f23;
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* The page runs edge to edge (viewport-fit=cover, and under the status
       bar when installed on the iOS Home Screen). The game fills the whole
       screen; HUD panels add the safe-area insets themselves. Padding the
       body instead made the game overflow it, which shifted the page up
       under the status bar and left a band at the bottom. */

    /* Loading screen */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #171c27;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #2a3244;
      border-top-color: #f2c14e;
      border-radius: 2px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 1rem;
      color: #888;
      font-size: 0.9rem;
    }

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .loading-spinner {
        animation: none;
        border-top-color: #f2c14e;
        border-right-color: #f2c14e;
      }
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!-- React root -->
  <div id="root">
    <!-- Loading screen shown while React loads -->
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading Riftholm...</p>
    </div>
  </div>

  <!-- Vite entry point -->
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
